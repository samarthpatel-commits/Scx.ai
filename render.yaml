services:
  - type: web
    name: scx-ai-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SCX_BASE_URL
        value: https://api.scx.ai/v1
      - key: SCX_API_KEY
        sync: false
      - key: SCX_DEFAULT_MODEL
        value: Meta-Llama-3.3-70B-Instruct
      - key: GROUNDED_ENDPOINT
        value: https://grounded-topaz.vercel.app/api/v1/monitor
      - key: GROUNDED_API_KEY
        sync: false
      - key: GROUNDED_AGENT_ID
        sync: false
      - key: APP_AUTH_KEY
        sync: false
      - key: DATABASE_URL
        sync: false


